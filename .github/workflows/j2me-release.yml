name: HSO real CLDC JAR build (release candidate)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-j2me.sh'
      - '.github/workflows/j2me-release.yml'
      - 'sources/GameScreen/**'
      - 'sources/GameObjects/Player.java'
      - 'sources/GameObjects/MainObject.java'
      - 'sources/GameObjects/MountTemplate.java'
      - 'sources/GameObjects/MainQuest.java'
      - 'sources/GameObjects/NPC.java'
      - 'sources/netcommand/global/ReadMessenge.java'
      - 'sources/Main/ChildLocationDiagnostics.java'
      - 'sources/Main/TestMenu.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  j2me:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Compile J2ME against real CLDC 1.0 and MIDP 2.0 APIs
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-j2me.sh 2>&1 | tee build-j2me.log
      - name: Upload actual JAR/JAD only after verified packaging
        uses: actions/upload-artifact@v4
        with:
          name: LyMeowz-HSO-J2ME-verified-build
          path: |
            dist/LyMeowz-HSO.jar
            dist/LyMeowz-HSO.jad
          if-no-files-found: error
      - name: Upload diagnostics on any failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LyMeowz-HSO-J2ME-failure-logs
          path: |
            build-j2me.log
            build/j2me/sources.txt
          if-no-files-found: warn
