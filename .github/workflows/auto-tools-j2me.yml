name: HSO LyMeowz Super Tool 4.0.1 CLDC build

on:
  push:
    branches:
      - feature/training-assistant-20261013
    paths:
      - 'sources/tools/**'
      - 'build-tools/**'
      - '.github/workflows/auto-tools-j2me.yml'
      - 'resources/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout source + compiled J2ME resources
        uses: actions/checkout@v4

      - name: Set up bytecode build JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile mod classes against original CLDC client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/mod-classes build/patcher-classes build/patch-classes build/jar-root
          javac --release 8 -encoding UTF-8 -cp resources -d build/mod-classes \
            sources/tools/core/ModeArbiter.java \
            sources/tools/core/SuperToolEngine.java \
            sources/tools/trading/TradeRoute.java \
            sources/tools/trading/TradeController.java \
            sources/tools/training/TargetPolicy.java \
            sources/tools/training/PatrolBrain.java \
            sources/tools/training/TrainingSettings.java \
            sources/tools/training/TrainingController.java \
            sources/tools/training/AutoFarmExplorer.java \
            sources/tools/navigation/TilePathfinder.java \
            sources/tools/navigation/SmartNavigator.java \
            sources/tools/navigation/WorldMemory.java \
            sources/tools/navigation/WorldTraveler.java \
            sources/tools/navigation/LocalSurvey.java \
            sources/tools/quest/QuestAssistant.java \
            sources/tools/boss/BossController.java \
            sources/tools/ui/ToolMenus.java \
            sources/tools/ui/ToolHud.java

      - name: Run Smart AI target and convoy-route unit tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/unit-test
          javac --release 8 -encoding UTF-8 -d build/unit-test \
            sources/tools/core/ModeArbiter.java \
            tests/tools/core/ModeArbiterTest.java \
            sources/tools/training/TargetPolicy.java \
            tests/tools/training/TargetPolicyTest.java \
            sources/tools/training/PatrolBrain.java \
            tests/tools/training/PatrolBrainTest.java \
            sources/tools/trading/TradeRoute.java \
            tests/tools/trading/TradeRouteTest.java \
            sources/tools/navigation/TilePathfinder.java \
            tests/tools/navigation/TilePathfinderTest.java \
            sources/tools/navigation/WorldMemory.java \
            tests/tools/navigation/WorldMemoryTest.java
          java -cp build/unit-test tools.core.ModeArbiterTest
          java -cp build/unit-test tools.training.TargetPolicyTest
          java -cp build/unit-test tools.training.PatrolBrainTest
          java -cp build/unit-test tools.trading.TradeRouteTest
          java -cp build/unit-test tools.navigation.TilePathfinderTest
          java -cp build/unit-test tools.navigation.WorldMemoryTest

      - name: Verify Vietnamese menu glyph coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          original=pathlib.Path("sources/CLib/mFont.java").read_text(encoding="utf-8")
          allowed=set(re.search(r'public static String str = "([^"]*)"',original).group(1))
          for path in pathlib.Path("sources/tools").rglob("*.java"):
              source=path.read_text(encoding="utf-8")
              for raw in re.findall(r'"([^"\\]*(?:\\.[^"\\]*)*)"',source):
                  bad={ch for ch in raw if ch not in allowed}
                  if bad:
                      raise AssertionError("%s contains missing font glyphs: %r in %r" %
                                           (path, "".join(sorted(bad)),raw))
          print("Vietnamese sprite-font glyph audit: PASS")
          PY

      - name: Compile the J2ME bytecode patcher
        shell: bash
        run: |
          set -euo pipefail
          javac \
            --add-exports java.base/jdk.internal.org.objectweb.asm=ALL-UNNAMED \
            --add-exports java.base/jdk.internal.org.objectweb.asm.commons=ALL-UNNAMED \
            -d build/patcher-classes \
            build-tools/tools/build/BytecodePatcher.java

      - name: Integrate modules into original bytecode
        shell: bash
        run: |
          set -euo pipefail
          java \
            --add-exports java.base/jdk.internal.org.objectweb.asm=ALL-UNNAMED \
            --add-exports java.base/jdk.internal.org.objectweb.asm.commons=ALL-UNNAMED \
            -cp build/patcher-classes tools.build.BytecodePatcher \
            resources build/mod-classes build/patch-classes
          cp -a resources/. build/jar-root/
          cp -a build/patch-classes/. build/jar-root/
          test -f build/jar-root/META-INF/MANIFEST.MF
          test -f build/jar-root/tools/trading/TradeController.class
          test -f build/jar-root/tools/training/TrainingController.class
          test -f build/jar-root/tools/ui/ToolMenus.class
          python3 - <<'PY'
          import pathlib, zipfile
          root = pathlib.Path("build/jar-root")
          with zipfile.ZipFile("build/HSO-AutoTools-Unverified.jar", "w", zipfile.ZIP_DEFLATED) as out:
              for file in sorted(root.rglob("*")):
                  if file.is_file():
                      out.write(file, file.relative_to(root).as_posix())
          PY

      - name: Set up Java 8 library for type hierarchy verification
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Preverify modified CLDC classes with ProGuard
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            https://repo.maven.apache.org/maven2/net/sf/proguard/proguard-base/6.2.2/proguard-base-6.2.2.jar \
            --output build/proguard.jar
          cat > build/proguard.pro <<'EOF'
          -injars patch-classes
          -outjars HSO-AutoTools-Preverified-Patches.jar
          -libraryjars ../resources
          -dontshrink
          -dontoptimize
          -dontobfuscate
          -dontwarn
          -ignorewarnings
          -microedition
          -target 1.1
          -keep class * { *; }
          EOF
          echo "-libraryjars ${JAVA_HOME}/jre/lib/rt.jar" >> build/proguard.pro
          java -cp build/proguard.jar proguard.ProGuard @build/proguard.pro
          unzip -oq build/HSO-AutoTools-Preverified-Patches.jar -d build/jar-root
          python3 - <<'PY'
          import pathlib, zipfile
          root = pathlib.Path("build/jar-root")
          with zipfile.ZipFile("build/LyMeowz-SuperTool-4.0.1.jar", "w", zipfile.ZIP_DEFLATED) as out:
              for file in sorted(root.rglob("*")):
                  if file.is_file():
                      out.write(file, file.relative_to(root).as_posix())
          PY

      - name: Verify output JAR and preverification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import struct, zipfile
          path="build/LyMeowz-SuperTool-4.0.1.jar"
          required=[
            "META-INF/MANIFEST.MF",
            "GameScreen/GameScreen.class",
            "Model/Menu2.class",
            "GameObjects/Player.class",
            "netcommand/global/ReadMessenge.class",
            "tools/ui/ToolMenus.class",
            "tools/ui/ToolHud.class",
            "tools/core/ModeArbiter.class",
            "tools/core/SuperToolEngine.class",
            "tools/training/TrainingController.class",
            "tools/training/TrainingSettings.class",
            "tools/training/TargetPolicy.class",
            "tools/training/PatrolBrain.class",
            "tools/training/AutoFarmExplorer.class",
            "tools/navigation/TilePathfinder.class",
            "tools/navigation/SmartNavigator.class",
            "tools/navigation/WorldMemory.class",
            "tools/navigation/WorldTraveler.class",
            "tools/navigation/LocalSurvey.class",
            "tools/quest/QuestAssistant.class",
            "tools/boss/BossController.class",
            "tools/trading/TradeController.class",
            "tools/trading/TradeRoute.class",
          ]
          with zipfile.ZipFile(path) as j:
            names=set(j.namelist())
            assert set(required).issubset(names), sorted(set(required)-names)
            assert len(names)>500, len(names)
            for name in required:
              if not name.endswith(".class"): continue
              data=j.read(name)
              assert data[:4] == bytes((0xCA, 0xFE, 0xBA, 0xBE))
              major=struct.unpack(">H",data[6:8])[0]
              assert major==45, (name,major)
              print(name, "classfile", major, "bytes", len(data))
            print("Total",len(names),"entries, JAR integrity OK")
          PY
          javap -v -classpath build/LyMeowz-SuperTool-4.0.1.jar tools.ui.ToolMenus \
            | grep -m1 -E 'StackMap:|StackMapTable:' || true

      - name: Regression test - preserve original HSO inventory menu
        shell: bash
        run: |
          set -euo pipefail
          javap -c -p -classpath build/LyMeowz-SuperTool-4.0.1.jar \
            tools.ui.ToolMenus > build/tool-menu-bytecode.txt
          javap -c -p -classpath build/LyMeowz-SuperTool-4.0.1.jar \
            GameScreen.GameScreen > build/game-menu-bytecode.txt
          python3 - <<'PY'
          from pathlib import Path
          bridge = Path("build/tool-menu-bytecode.txt").read_text()
          game = Path("build/game-menu-bytecode.txt").read_text()
          src = Path("sources/tools/ui/ToolMenus.java").read_text(encoding="utf-8")
          assert "cmdMyseft:" in bridge, "missing native inventory field"
          assert "putfield" in bridge and "cmdMyseft:" in bridge, "inventory command not restored"
          assert "Model/T.tabhanhtrang:" in bridge, "inventory label missing"
          assert "Method CLib/mVector.setElementAt:" in bridge, "null entry not replaced"
          assert "Method CLib/mVector.insertElementAt:" in bridge, "inventory not restored to first slot"
          assert "cmdMyseft:" in game, "original menu has no inventory entry"
          assert "Method GameScreen/TabScreenNew.Show:" in game, "original inventory handler gone"
          assert 'choices.addElement(action(T.tabhanhtrang, 1));' in src, "hub inventory shortcut missing"
          assert "tools/ui/ToolHud.paint:" in game, "HUD paint hook missing"
          assert "tools/core/SuperToolEngine" in bridge, "central tool engine not wired"
          assert '"LyMeowz - Công cụ".equals(cmd.caption)' in src, "quick menu ID 15 not scoped"
          assert "case 1:" not in src[src.index("public static boolean dispatch"):src.index("public static boolean quickAction")], "native inventory id intercepted"
          print("Inventory/menu regression PASS: native item restored, first slot kept, handler intact.")
          PY

      - name: Publish completed J2ME JAR
        uses: actions/upload-artifact@v4
        with:
          name: HSO-LyMeowz-SuperTool-4.0.1-JAR
          path: build/LyMeowz-SuperTool-4.0.1.jar
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HSO-AutoTools-build-logs
          path: |
            build/proguard.pro
            build/HSO-AutoTools-Unverified.jar
          if-no-files-found: ignore
