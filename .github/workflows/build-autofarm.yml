name: Build HSO Auto Farm Java ME JAR
on:
  push:
    branches: [main]
    paths:
      - 'decompiled-src/Tool/**'
      - 'tools/BuildFarmJar.java'
      - 'tools/build-autofarm.sh'
      - '.github/workflows/build-autofarm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-autofarm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build preverified Java ME JAR and JAD
        run: bash tools/build-autofarm.sh
      - name: Upload installable build
        uses: actions/upload-artifact@v4
        with:
          name: HSO-AutoFarm-v403-J2ME-preverified
          path: |
            dist/HSO_AutoFarm_v403.jar
            dist/HSO_AutoFarm_v403.jad
          if-no-files-found: error
          retention-days: 30
