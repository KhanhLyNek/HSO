name: Phase 1 isolated core tests

on:
  push:
    branches:
      - release/phase1-core-tests
    paths:
      - 'sources/tools/core/ModeArbiter.java'
      - 'sources/tools/training/TargetPolicy.java'
      - 'tests/tools/core/ModeArbiterTest.java'
      - 'tests/tools/training/TargetPolicyTest.java'
      - '.github/workflows/phase1-core-tests.yml'
  pull_request:
    paths:
      - 'sources/tools/core/ModeArbiter.java'
      - 'sources/tools/training/TargetPolicy.java'
      - 'tests/tools/core/ModeArbiterTest.java'
      - 'tests/tools/training/TargetPolicyTest.java'
      - '.github/workflows/phase1-core-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Compile isolated policies
        run: |
          set -euo pipefail
          mkdir -p build/phase1
          javac -encoding UTF-8 -d build/phase1 \
            sources/tools/core/ModeArbiter.java \
            tests/tools/core/ModeArbiterTest.java \
            sources/tools/training/TargetPolicy.java \
            tests/tools/training/TargetPolicyTest.java
      - name: Run regression tests
        run: |
          set -euo pipefail
          java -cp build/phase1 tools.core.ModeArbiterTest
          java -cp build/phase1 tools.training.TargetPolicyTest
