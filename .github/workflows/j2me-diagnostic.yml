name: HSO J2ME source diagnostics (NOT release)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Compile diagnostics with MIDP stub
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/j2me-stub/javax/microedition/lcdui build/classes
          cat > /tmp/j2me-stub/javax/microedition/lcdui/Graphics.java <<'EOF'
          package javax.microedition.lcdui;
          public class Graphics {
            public static final int TOP=16, LEFT=4;
            public int getColor(){return 0;}
            public void setColor(int c){}
            public int getClipX(){return 0;}
            public int getClipY(){return 0;}
            public int getClipWidth(){return 240;}
            public int getClipHeight(){return 320;}
            public void setClip(int x,int y,int w,int h){}
            public void fillRect(int x,int y,int w,int h){}
            public void drawRect(int x,int y,int w,int h){}
            public void drawString(String s,int x,int y,int anchor){}
          }
          EOF
          javac -source 7 -target 7 -sourcepath /tmp/j2me-stub -d build/classes \
            /tmp/j2me-stub/javax/microedition/lcdui/Graphics.java \
            sources/Main/ChildLocationDiagnostics.java \
            sources/Main/TestMenu.java
          test -f build/classes/Main/TestMenu.class
          test -f build/classes/Main/ChildLocationDiagnostics.class
      - name: Verify source inventory
        run: |
          echo "Java sources: $(find sources -name '*.java' | wc -l)"
          echo "Precompiled classes: $(find resources -name '*.class' | wc -l)"
          test -f resources/META-INF/MANIFEST.MF
          test -f sources/com/silverknight/TemCanvas.java
      - name: Upload compiled diagnostic classes
        uses: actions/upload-artifact@v4
        with:
          name: hso-menu-diagnostic-classes
          path: |
            build/classes/Main/TestMenu.class
            build/classes/Main/ChildLocationDiagnostics.class
          if-no-files-found: error
      - name: Report J2ME release readiness without publishing a fake JAR
        shell: bash
        run: |
          set -euo pipefail
          test ! -f build/HSO-Test.jar
          {
            echo '## J2ME release status: NOT BUILT'
            echo
            echo '- PASS: Java source diagnostics against a temporary MIDP stub.'
            echo '- NOT VERIFIED: entire J2ME client recompiled with real MIDP/CLDC APIs.'
            echo '- NOT VERIFIED: CLDC preverification, packaging, and device/emulator startup.'
            echo '- NO runnable JAR published by this diagnostic workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::This workflow tests sources only, not a runnable J2ME JAR."
