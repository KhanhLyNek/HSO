name: HSO J2ME diagnostic build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Compile diagnostics with MIDP stub
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/j2me-stub/javax/microedition/lcdui build/classes
          cat > /tmp/j2me-stub/javax/microedition/lcdui/Graphics.java <<'EOF'
          package javax.microedition.lcdui;
          public class Graphics {
            public static final int TOP=16, LEFT=4;
            public int getColor(){return 0;}
            public void setColor(int c){}
            public int getClipX(){return 0;}
            public int getClipY(){return 0;}
            public int getClipWidth(){return 240;}
            public int getClipHeight(){return 320;}
            public void setClip(int x,int y,int w,int h){}
            public void fillRect(int x,int y,int w,int h){}
            public void drawRect(int x,int y,int w,int h){}
            public void drawString(String s,int x,int y,int anchor){}
          }
          EOF
          javac -source 7 -target 7 -sourcepath /tmp/j2me-stub -d build/classes \
            /tmp/j2me-stub/javax/microedition/lcdui/Graphics.java \
            sources/Main/ChildLocationDiagnostics.java \
            sources/Main/TestMenu.java
          test -f build/classes/Main/TestMenu.class
          test -f build/classes/Main/ChildLocationDiagnostics.class
      - name: Verify source inventory
        run: |
          echo "Java sources: $(find sources -name '*.java' | wc -l)"
          echo "Precompiled classes: $(find resources -name '*.class' | wc -l)"
          test -f resources/META-INF/MANIFEST.MF
          test -f sources/com/silverknight/TemCanvas.java
      - name: Upload compiled diagnostic classes
        uses: actions/upload-artifact@v4
        with:
          name: hso-menu-diagnostic-classes
          path: |
            build/classes/Main/TestMenu.class
            build/classes/Main/ChildLocationDiagnostics.class
          if-no-files-found: error
      - name: Assemble candidate MIDlet JAR from existing compiled classes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/jar
          cp -a resources/. build/jar/
          mkdir -p build/jar/Main
          cp build/classes/Main/TestMenu.class build/jar/Main/
          cp build/classes/Main/ChildLocationDiagnostics.class build/jar/Main/
          if [ ! -f build/jar/com/silverknight/TemMidlet.class ]; then
            echo "::error::Missing compiled TemMidlet.class. Decompiled .java files cannot be packaged as a runnable J2ME game without a full CLDC/MIDP compiler and preverification."
            exit 1
          fi
          if [ ! -f build/jar/com/silverknight/TemCanvas.class ]; then
            echo "::error::Missing compiled TemCanvas.class; overlay integration is not present in the packaged game."
            exit 1
          fi
          jar cfm build/HSO-Test.jar resources/META-INF/MANIFEST.MF -C build/jar .
          jar tf build/HSO-Test.jar | grep -q '^Main/TestMenu.class$'
          jar tf build/HSO-Test.jar | grep -q '^com/silverknight/TemMidlet.class$'
          echo "::warning::JAR assembly does not prove edited TemCanvas/ReadMessenge bytecode is included or MIDP compatibility. Do not distribute as a verified online test build."
      - name: Upload candidate JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HSO-Test-candidate-JAR
          path: build/HSO-Test.jar
          if-no-files-found: error
