name: LyMeowz main Java smoke build
on:
  push:
    branches: [main]
    paths:
      - 'sources/GameScreen/GameScreen.java'
      - 'sources/GameObjects/Player.java'
      - 'sources/GameObjects/NPC.java'
      - 'sources/GameScreen/LyMeowzMapReader.java'
      - 'sources/GameScreen/LyMeowzNpcMapRegistry.java'
      - 'sources/GameScreen/LyMeowzMapTransitions.java'
      - 'sources/GameScreen/LyMeowzWorldStore.java'
      - 'sources/netcommand/global/ReadMessenge.java'
      - 'tests/LyMeowzNavigationTest.java'
      - '.github/workflows/lymeowz-main-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Verify menu and target integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          game=Path('sources/GameScreen/GameScreen.java').read_text()
          player=Path('sources/GameObjects/Player.java').read_text()
          assert 'public boolean isLyMeowzIntelligenceEnabled()' in game
          assert 'case 82:' in game and 'toggleLyMeowzIntelligence();' in game
          assert 'selectLyMeowzLevelTarget()' in player
          assert 'mob.Lv < this.Lv - 3' in player
          assert 'isAutoFire < 0' in player
          assert 'this.hp <= 0' in player
          assert 'distance + nearbyPlayers * crowdPenalty' in player
          assert 'int crowdPenalty = range / 4;' in player
          assert 'other.typeObject == 0' in player
          assert 'if (nearbyPlayers >= 4) break;' in player
          assert 'Player.isAutoFire = (byte) 1;' in game
          assert 'Player.xBeginAutoFire = player.x;' in game
          print('LyMeowz integration static checks: PASS')
          PY
      - name: Compile changed game sources against original class resources
        run: |
          set -euo pipefail
          mkdir -p build/smoke build/smoke-stubs build/stub-src/javax/microedition/midlet
          # This stub is used solely to verify JVM compilation of decompiled sources.
          # It is NOT a substitute for MIDP/CLDC libraries in a runnable J2ME JAR.
          cat > build/stub-src/javax/microedition/midlet/MIDlet.java <<'EOF'
          package javax.microedition.midlet;
          public abstract class MIDlet {
            protected MIDlet() {}
            protected abstract void startApp() throws Exception;
            protected abstract void pauseApp();
            protected abstract void destroyApp(boolean unconditional) throws Exception;
            public final void notifyDestroyed() {}
          }
          EOF
          mkdir -p build/stub-src/javax/microedition/lcdui
          cat > build/stub-src/javax/microedition/lcdui/Image.java <<'EOF'
          package javax.microedition.lcdui;
          public class Image {}
          EOF
          javac -d build/smoke-stubs \
            build/stub-src/javax/microedition/midlet/MIDlet.java \
            build/stub-src/javax/microedition/lcdui/Image.java
          javac -encoding UTF-8 -cp resources:build/smoke-stubs -d build/smoke \
            sources/GameScreen/GameScreen.java \
            sources/GameObjects/Player.java \
            sources/GameObjects/NPC.java \
            sources/GameScreen/LyMeowzMapReader.java \
            sources/GameScreen/LyMeowzNpcMapRegistry.java \
            sources/GameScreen/LyMeowzMapTransitions.java \
            sources/GameScreen/LyMeowzWorldStore.java \
            sources/netcommand/global/ReadMessenge.java \
            sources/Main/ChildLocationDiagnostics.java 2>&1 | tee build/smoke-compile.log
          test -f build/smoke/GameScreen/GameScreen.class
          test -f build/smoke/GameObjects/Player.class
          test -f build/smoke/GameObjects/NPC.class
          test -f build/smoke/GameScreen/LyMeowzMapReader.class
      - name: Test obstacle routing and unreachable goals
        run: |
          cat > /tmp/TestLyMeowzMap.java <<'EOF'
          import GameScreen.LyMeowzMapReader;
          public class TestLyMeowzMap {
            public static void main(String[] args) {
              int[] map = {0,1,0, 0,1,0, 0,0,0};
              short[] path = LyMeowzMapReader.route(map,3,3,0,0,2,0,20);
              if (path.length != 6) throw new AssertionError("detour length="+path.length);
              if (path[path.length-1] != (short)(2 << 8)) throw new AssertionError("goal");
              if (LyMeowzMapReader.route(map,3,3,0,0,2,0,4).length != 0) throw new AssertionError("limit");
              if (LyMeowzMapReader.route(map,3,3,0,0,1,0,20).length != 0) throw new AssertionError("wall");
              if (LyMeowzMapReader.route(map,3,3,-1,0,2,0,20).length != 0) throw new AssertionError("bounds");
              System.out.println("LyMeowz route tests: PASS");
            }
          }
          EOF
          javac -cp build/smoke -d /tmp /tmp/TestLyMeowzMap.java
          java -cp /tmp:build/smoke TestLyMeowzMap
      - name: Test cross-map BFS, gate IDs and quest NPC cache
        run: |
          set -euo pipefail
          javac -cp build/smoke -d build/smoke tests/LyMeowzNavigationTest.java
          java -cp build/smoke:resources LyMeowzNavigationTest
          test -f build/smoke/netcommand/global/ReadMessenge.class
          test -f build/smoke/GameScreen/LyMeowzMapTransitions.class
          test -f build/smoke/GameScreen/LyMeowzNpcMapRegistry.class
      - name: Upload compile output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lymeowz-smoke-diagnostics
          path: |
            build/smoke-compile.log
            build/smoke/
          if-no-files-found: warn
